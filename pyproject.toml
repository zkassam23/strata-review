[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-review"
version = "0.1.0"
description = "Strata document review for BC condo transactions"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.5,<2",
  "pdfplumber>=0.11,<0.12",
  "pypdf>=6,<7",
  "pytesseract>=0.3.13,<0.4",
  "pillow>=10,<13",
  "pydantic>=2.6,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6,<7",
  "jinja2>=3.1,<4",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "reportlab>=4,<6"]

[project.scripts]
strata-review = "strata_review.cli:main"
strata-review-web = "web.app:main"

[tool.setuptools.packages.find]
include = ["strata_review*", "web*", "synth*"]

[tool.setuptools.package-data]
strata_review = ["templates/*.html"]
web = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
