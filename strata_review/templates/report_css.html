<style>
:root{
  --ink:#080807;--raised:#141412;--sunk:#0C0C0A;--line:#282824;--soft:#1C1C19;
  --gold:#C9A24B;--gold-lo:#8C6F31;--gold-hi:#EBDCAC;
  --paper:#F2F0EA;--dim:#C2BFB5;--muted:#89887F;
  --red:#D9544F;--red-bg:#241110;--amb:#D99B2F;--amb-bg:#241C0C;--grn:#5FA06B;--grn-bg:#0F1A12;
  --flag:#E0A33E;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:0 24px}
h1,h2,.sf{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;line-height:1.15}
h1{font-size:clamp(32px,4.6vw,50px)}
h2{font-size:27px;margin-bottom:16px}
h3{font-size:17px;font-weight:500;margin-bottom:6px}
p{max-width:66ch;margin-bottom:14px;color:var(--dim)}
a{color:var(--gold)}
.muted{color:var(--muted);font-size:14px}
.gold{color:var(--gold)}
section{padding:56px 0;border-top:1px solid var(--soft)}
.rpt{background:var(--raised);border:1px solid var(--line);padding:34px}
.rpthead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.brand .k{width:38px;height:38px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-family:"Cormorant Garamond",serif;font-size:20px;color:var(--gold)}
.brand b{font-family:"Cormorant Garamond",serif;font-size:18px;font-weight:500;display:block}
.brand span{font-size:12.5px;color:var(--muted)}
.addr{font-family:"Cormorant Garamond",serif;font-size:29px;margin:26px 0 4px}
.meta{font-size:13.5px;color:var(--muted);margin-bottom:26px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--soft);border:1px solid var(--soft);margin-bottom:28px}
.tile{background:var(--ink);padding:18px}
.tile span{font-size:12.5px;color:var(--muted);display:block;margin-bottom:6px}
.tile b{font-family:"Cormorant Garamond",serif;font-size:27px;font-weight:500;line-height:1}
.tile b.sm{font-size:19px}
.sum{margin-bottom:28px}
.sumrow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:11px 0;border-bottom:1px solid var(--soft);font-size:15px}
.pill{font-size:11.5px;padding:3px 11px;border-radius:3px;white-space:nowrap}
.p-red{background:var(--red-bg);color:var(--red)}
.p-amb{background:var(--amb-bg);color:var(--amb)}
.p-grn{background:var(--grn-bg);color:var(--grn)}
.p-mut{background:var(--sunk);color:var(--muted);border:1px solid var(--soft)}
.fl{border:1px solid var(--line);border-left:3px solid var(--line);padding:20px 22px;margin-bottom:13px}
.fl.red{border-left-color:var(--red)}
.fl.amb{border-left-color:var(--amb)}
.fl .ttl{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:9px;flex-wrap:wrap}
.fl h3{margin:0;font-size:17px}
.fl p{font-size:14.5px;margin-bottom:11px}
.cites{display:flex;flex-wrap:wrap;gap:6px}
.cite{background:var(--sunk);border:1px solid var(--soft);font-size:11.5px;padding:4px 10px;color:var(--muted)}
.cite.abs{border-style:dashed}
.ask{background:var(--sunk);border:1px solid var(--line);padding:22px 24px;margin-top:26px}
.ask ol{margin:12px 0 0 20px;font-size:14.5px;color:var(--dim)}
.ask li{margin-bottom:8px}
.disc{font-size:12.5px;color:var(--muted);margin-top:26px;padding-top:18px;border-top:1px solid var(--line);line-height:1.6}
.quiet{font-size:14px;color:var(--muted);padding:14px 0 4px;border-top:1px solid var(--soft);margin-top:6px}
.judge{background:#241B08;border-left:3px solid var(--flag);padding:9px 12px;font-size:13px;color:var(--flag);margin:6px 0 11px;max-width:66ch}
.rule{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.appx{margin-top:34px;padding-top:24px;border-top:1px solid var(--line)}
.appx h3{font-family:"Cormorant Garamond",serif;font-size:21px;margin-bottom:10px}
.appx h4{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 6px;font-weight:500}
.appx ul{margin:0 0 6px 18px;font-size:13.5px;color:var(--dim)}
.appx li{margin-bottom:4px}
.appx p{font-size:13.5px}
@media(max-width:720px){.tiles{grid-template-columns:1fr}.rpt{padding:20px}}
@media print{body{background:#fff;color:#111}.rpt{border:none}}
</style>
